name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [22, 24]
        ink-version: [6]
        include:
          # Compatibility leg: verify the advertised `ink >=6` peer range
          # against the current ink major.
          - node-version: 22
            ink-version: 7
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
      - run: npm ci
      - run: npm install --no-save ink@^7
        if: matrix.ink-version == 7
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test -- --coverage
      - run: npm run build
